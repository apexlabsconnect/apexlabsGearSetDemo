<template>
    <lightning-card title="Parts Requirement" icon-name="standard:product">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Part Name"
                value={partName}
                onchange={handlePartNameChange}
                required>
            </lightning-input>

            <lightning-input
                type="number"
                label="Quantity"
                value={quantity}
                min="1"
                onchange={handleQuantityChange}
                required>
            </lightning-input>

            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Add Part"
                    onclick={handleSave}>
                </lightning-button>
            </div>

        </div>

    </lightning-card>
</template>
